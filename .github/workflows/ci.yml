name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-compile:
    name: Lint & Compile (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # 只装轻量依赖：torch 体积过大，CI 中跳过
      - name: Install lightweight deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pillow opencv-python-headless matplotlib ruff

      - name: Syntax check (all sources)
        run: python -m compileall -q analysis halftoning_algorithms PredictiveReversibleHalftoning HTpro_ui.py build.py

      - name: Ruff (errors only)
        run: ruff check --select E9,F63,F7,F82 --output-format=github .

      - name: Import smoke test (classic algorithms)
        run: |
          python -c "import importlib; [importlib.import_module(m) for m in ['analysis.R','analysis.D3','analysis.RAPSD','analysis.floyA','halftoning_algorithms.youxu','halftoning_algorithms.vacmain','halftoning_algorithms.bippcca']]"
          echo "imports ok"
